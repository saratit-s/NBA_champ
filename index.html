<title>Hardwood Gacha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: arena night. Sticky scoreboard-style header + tabs, one content column (max 1100px). Cards are the hero. */
:root{
  color-scheme:dark;
  --bg:#0d1220; --panel:#151c2d; --panel2:#1c2539; --line:#2a3550;
  --fg:#eef1f8; --muted:#8e98b0;
  --accent:#ff7a1a; --accent2:#ffb067; --wood:#c98a4b; --wood2:#a86b34;
  --c-common:#9aa4b8; --c-rare:#3fa9f5; --c-epic:#cf5cf0; --c-legend:#f5c451;
  --win:#3ccf7a; --lose:#ff5a5f;
  --f-display:"Teko","Bebas Neue","Arial Narrow",Impact,sans-serif;
  --f-body:"Kanit","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;font-weight:300;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:30px;line-height:.9;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo .ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffa45c,var(--accent) 55%,#c8530a);position:relative;overflow:hidden;flex:none}
.logo .ball::before,.logo .ball::after{content:"";position:absolute;inset:0;border:1.5px solid #3a1a05;border-radius:50%}
.logo .ball::before{transform:scaleX(.45)}
.logo .ball::after{border-width:0;border-top:1.5px solid #3a1a05;top:50%;height:0;border-radius:0}
.logo b{color:var(--accent)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip.user{font-family:var(--f-body);font-size:13px;padding:3px 10px 3px 4px;max-width:220px}
.chip.user img{width:24px;height:24px;border-radius:50%;flex:none}
.chip.user .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.user .sy{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.user .sy.bad{color:var(--lose)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-family:var(--f-display);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.04em}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--c-legend) 60%,#b8862a);flex:none}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 6px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.eyebrow{font-family:var(--f-display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}

.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ff8f3a,var(--accent));border-color:#ff9a4d;color:#1b0b00}
.btn.gold{background:linear-gradient(180deg,#ffe08a,var(--c-legend));border-color:#ffe39a;color:#2a1c00}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.price{font-family:var(--f-display);font-size:19px;line-height:1;display:inline-flex;align-items:center;gap:4px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:10px 16px;z-index:50;font-weight:500;max-width:calc(100% - 32px)}

/* ---------- CARD ---------- */
.card{--cw:128px;--rc:var(--c-common);width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.08);padding:3px;position:relative;background:linear-gradient(150deg,color-mix(in srgb,var(--rc) 100%,#fff 30%),var(--rc) 40%,color-mix(in srgb,var(--rc) 55%,#000));flex:none;user-select:none}
.card.r-R{--rc:var(--c-rare)} .card.r-E{--rc:var(--c-epic)} .card.r-L{--rc:var(--c-legend)}
.card .in{position:relative;height:100%;border-radius:calc(var(--cw)*.065);overflow:hidden;display:flex;flex-direction:column;padding:calc(var(--cw)*.06);
  background:radial-gradient(120% 70% at 50% 38%,color-mix(in srgb,var(--rc) 35%,#141a2a),#10141f 70%)}
.card .in::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--cw)*.12),rgba(255,255,255,.025) calc(var(--cw)*.12) calc(var(--cw)*.125));pointer-events:none}
.card.r-L .in::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,240,190,.28) 48%,rgba(140,220,255,.18) 52%,transparent 60%);animation:sheen 3.2s linear infinite;pointer-events:none}
.card.r-E .in::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 44%,rgba(240,190,255,.16) 50%,transparent 56%);animation:sheen 4.5s linear infinite;pointer-events:none}
@keyframes sheen{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.c-ovr{font-family:var(--f-display);font-weight:600;font-size:calc(var(--cw)*.27);line-height:.8;color:#fff}
.c-pos{font-family:var(--f-display);font-size:calc(var(--cw)*.13);line-height:1;color:var(--rc);letter-spacing:.05em}
.c-rar{font-family:var(--f-display);font-size:calc(var(--cw)*.1);letter-spacing:.1em;color:var(--rc);text-align:right;line-height:1.1}
.c-stars{font-size:calc(var(--cw)*.075);color:var(--c-legend);letter-spacing:-.05em;text-align:right;line-height:1}
.c-av{position:relative;z-index:1;margin:calc(var(--cw)*.02) auto 0;width:calc(var(--cw)*.46);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--cw)*.2);font-weight:600;color:#fff;
  background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 62%),hsl(var(--h) 60% 34%));box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 70%,transparent),0 6px 14px rgba(0,0,0,.4)}
.c-name{position:relative;z-index:1;margin-top:auto;text-align:center;font-weight:600;font-size:calc(var(--cw)*.088);line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.c-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);margin-top:calc(var(--cw)*.03);border-top:1px solid color-mix(in srgb,var(--rc) 40%,transparent);padding-top:calc(var(--cw)*.025);text-align:center}
.c-stats div{font-family:var(--f-display);font-size:calc(var(--cw)*.105);line-height:.95;font-variant-numeric:tabular-nums}
.c-stats span{display:block;font-size:calc(var(--cw)*.062);color:var(--muted);letter-spacing:.04em}
.card.locked{filter:grayscale(1);opacity:.32}
.card .badge{position:absolute;z-index:3;top:-8px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:16px;line-height:1;padding:3px 9px 1px;border-radius:999px;background:var(--accent);color:#1b0b00;white-space:nowrap}
.card .badge.up{background:var(--win)}
.card .badge.cash{background:var(--c-legend)}
.card.click{cursor:pointer;transition:transform .12s}
.card.click:hover{transform:translateY(-3px)}

/* flip reveal */
.flip{width:var(--cw);aspect-ratio:5/7;perspective:900px;--cw:128px;position:relative;cursor:pointer}
.flip .fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.flip.open .fi{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .front .card{--cw:inherit;width:100%}
.back{border-radius:10px;border:3px solid var(--line);background:
  radial-gradient(circle at 50% 50%,transparent 27%,var(--accent) 27.5% 29%,transparent 29.5%),
  repeating-linear-gradient(45deg,#18213a 0 10px,#141c31 10px 20px);display:grid;place-items:center}
.back span{font-family:var(--f-display);font-size:30px;color:var(--accent);letter-spacing:.05em}
.flip.glow-E .back{border-color:var(--c-epic);box-shadow:0 0 18px color-mix(in srgb,var(--c-epic) 60%,transparent)}
.flip.glow-L .back{border-color:var(--c-legend);box-shadow:0 0 26px var(--c-legend);animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.flip.open.glow-L .back{animation:none}

/* ---------- GACHA ---------- */
.banner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center;padding:24px;border-radius:18px;
  background:radial-gradient(80% 120% at 85% 50%,rgba(255,122,26,.22),transparent 60%),linear-gradient(135deg,#1a2238,#121828);border:1px solid var(--line);overflow:hidden}
.banner h2{font-size:52px}
.banner h2 em{font-style:normal;color:var(--accent)}
.showcase{display:flex;justify-content:center;align-items:flex-end;min-height:230px}
.showcase .card{--cw:132px;margin:0 -22px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.showcase .card:nth-child(1){transform:rotate(-10deg) translateY(14px)}
.showcase .card:nth-child(2){z-index:2;--cw:150px}
.showcase .card:nth-child(3){transform:rotate(10deg) translateY(14px)}
.rates{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.rate{border-radius:6px;padding:2px 10px;font-size:13px;font-weight:500;border:1px solid var(--rc);color:var(--rc)}
.pullbtns{display:flex;gap:10px;flex-wrap:wrap}
.pity{margin-top:12px;font-size:13px;color:var(--muted)}
.pitybar{height:6px;border-radius:3px;background:var(--panel2);margin-top:5px;overflow:hidden;max-width:320px}
.pitybar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-legend))}
.reveal{margin-top:22px;display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;padding:22px 8px 8px}
.reveal-bar{display:flex;justify-content:center;gap:10px;margin-top:12px}
.startprog{margin:14px 0;font-size:14px;color:var(--muted)}
.startprog .n{font-family:var(--f-display);font-size:44px;line-height:.9;color:var(--accent)}
.startpos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-self:center}
.startpos div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.startpos div.ok{border-color:var(--win)}
.startpos b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--muted)}
.startpos span{font-family:var(--f-display);font-size:34px;line-height:1}
nav button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- TEAM ---------- */
.teamgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.court{position:relative;width:100%;aspect-ratio:1/1.08;border-radius:14px;overflow:hidden;border:3px solid #e9dcc6;
  background:repeating-linear-gradient(90deg,var(--wood) 0 38px,#c48546 38px 39px,#cf9353 39px 77px,#bf8040 77px 78px)}
.court::before{content:"";position:absolute;left:32%;right:32%;top:0;height:46%;background:rgba(255,122,26,.55);border:3px solid #f2e6d2;border-top:0}
.court::after{content:"";position:absolute;left:8%;right:8%;top:-38%;height:96%;border:3px solid #f2e6d2;border-radius:50%}
.court .hoop{position:absolute;left:50%;top:5%;width:30px;height:30px;transform:translateX(-50%);border:3px solid var(--accent);border-radius:50%;z-index:1}
.slot{position:absolute;transform:translateX(-50%);z-index:2;--cw:clamp(66px,17vw,112px)}
.slot .card,.slot .empty,.benchrow .card,.benchrow .empty{--cw:inherit}
.empty{width:var(--cw);aspect-ratio:5/7;border-radius:10px;border:2px dashed rgba(255,255,255,.55);background:rgba(13,18,32,.55);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:calc(var(--cw)*.2);line-height:1;color:#fff;cursor:pointer}
.empty small{display:block;font-size:.55em;color:var(--muted);font-family:var(--f-body)}
.slot .lbl,.benchrow .lbl{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:3;background:#0d1220;border:1px solid var(--line);border-radius:6px;font-family:var(--f-display);font-size:15px;line-height:1;padding:3px 7px 1px;white-space:nowrap}
.lbl.pen{border-color:var(--lose);color:#ffb3b5}
.benchwrap{margin-top:26px}
.benchrow{display:flex;gap:14px;flex-wrap:wrap;--cw:clamp(66px,17vw,104px)}
.benchrow > div{position:relative}
.ratings{display:grid;gap:12px}
.rt{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px}
.rt b{font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.05em;color:var(--muted)}
.rt .bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.rt .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--wood2),var(--accent))}
.rt span{font-family:var(--f-display);font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.bigovr{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.bigovr .n{font-family:var(--f-display);font-size:78px;line-height:.8;color:var(--accent)}
.note{font-size:13px;color:var(--muted)}

/* roster table + picker list */
.rosterbox{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 6px 2px;overflow-x:auto}
.rosterbox h3{font-family:var(--f-display);font-weight:500;font-size:22px;margin:6px 8px 2px}
.rosterbox tr.rowclick{cursor:pointer}
.rosterbox tr.rowclick:hover td{background:rgba(255,122,26,.07)}
.rosterbox td{font-size:14px;padding:7px 8px}
.rosterbox td.n{font-family:var(--f-display);font-size:20px;line-height:1}
.rosterbox td.o{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--accent2)}
.slotlbl{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--rc)}
.s-hi{color:var(--c-legend)} .s-gd{color:var(--win)} .s-lo{color:#ff9a9d}
.penx{font-size:12px;color:#ffb3b5;margin-left:6px}
.plist{display:grid;gap:6px}
.pgrp{font-family:var(--f-display);font-size:24px;line-height:1;margin-top:10px;padding:4px 2px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.pgrp:first-child{margin-top:0}
.pgrp span{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 64px minmax(0,300px);gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:8px 12px}
.prow:hover{border-color:var(--accent);border-left-color:var(--rc)}
.prow.cur{background:rgba(255,122,26,.1)}
.mini-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 62%),hsl(var(--h) 60% 34%))}
.pn{min-width:0}
.pn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small{font-size:12px;color:var(--muted)}
.pn small .bad{color:#ffb3b5} .pn small .use{color:var(--accent2)}
.povr{font-family:var(--f-display);font-size:34px;line-height:.9;text-align:center}
.povr span{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.pst{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.pst div{font-family:var(--f-display);font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.pst span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.pst i{display:block;font-style:normal;font-size:13px;height:13px}
.up{color:var(--win)} .dn{color:#ff9a9d}
@media (max-width:640px){
  .prow{grid-template-columns:40px minmax(0,1fr) 54px}
  .pst{grid-column:1/-1}
}

/* ---------- ENHANCE + MARKET ---------- */
.c-plus{font-family:var(--f-display);font-size:calc(var(--cw)*.13);line-height:1;color:var(--accent);text-align:right;letter-spacing:0}
.btn.danger{border-color:var(--lose);color:#ffc9ca}
.enhgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.enhmain{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.enhcard{flex:none}
.enhcard.ok .card{animation:enhok .9s}
.enhcard.fail .card{animation:shake .35s 2}
@keyframes enhok{0%{filter:brightness(2.2) drop-shadow(0 0 30px var(--c-legend))}100%{filter:none}}
.enhinfo{flex:1;min-width:min(100%,230px);display:grid;gap:12px}
.enhlv{font-family:var(--f-display);font-size:64px;line-height:.8;display:flex;align-items:baseline;gap:12px}
.enhlv .to{color:var(--accent)} .enhlv b{font-size:36px;color:var(--muted);font-weight:400}
.enhstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.enhstats div{background:var(--panel2);border-radius:8px;padding:6px 8px;font-family:var(--f-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.enhstats span{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-bottom:2px}
.enhstats b{font-weight:400;font-size:16px;margin-left:6px}
.enhmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.enhmeta div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.enhmeta span{display:block;font-size:12px;color:var(--muted)}
.enhmeta b{font-family:var(--f-display);font-size:24px;font-weight:500;line-height:1}
.enhmsg{margin:0;font-weight:600;font-size:16px} .enhmsg.ok{color:var(--win)} .enhmsg.fail,.enhmsg.broke{color:var(--lose)}
.starup{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.enhmeta small{font-size:11px}
.enhwarn{border:1px solid var(--lose);background:rgba(255,90,95,.1);border-radius:10px;padding:10px 12px;font-size:14px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 54px auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:8px 12px}
button.srow:hover{border-color:var(--accent);border-left-color:var(--rc)}
.srow.cur{background:rgba(255,122,26,.12);border-color:var(--accent);border-left-color:var(--rc)}
.srow .pn small .use{color:var(--accent2)}
.pplus{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--accent);min-width:40px;text-align:right}

function normalize(s){

  Object.values(st.owned).forEach(o=>{o.spares=o.spares||[];o.plus=o.plus||0;o.spent=o.spent||0;});

const DEVICE=(()=>{try{let d=localStorage.getItem(KEY+"-dev");if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem(KEY+"-dev",d);}return d;}catch(e){return Math.random().toString(36).slice(2,10);}})();

async function flushCloud(){
  if(!cloud.ref||cloud.busy||!cloud.dirty)return;
  cloud.busy=true; cloud.dirty=false; cloud.at=Date.now(); setSync("saving");
  try{await cloud.ref.set({v:1,at:cloud.at,dev:DEVICE,s:JSON.parse(JSON.stringify(S))});setSync("ok");}

// effective attributes: +2 per extra star, -4 per position step away from the slot
// s = star count, or an owned-card object {stars, plus}; each enhancement +1 adds +1 to everything
function eff(pd,s=1,slot=null,adj=0){
  const stars=typeof s==="object"?s.stars:s, plus=typeof s==="object"?(s.plus||0):0, cb=typeof s==="object"?(s.bonus||0):0;

  const b=(stars-1)*2+plus+cb-pen+adj; const e={ovr:Math.round(pd.ovr+b),pen};
  ATTR.forEach(k=>e[k]=clamp(Math.round(pd[k]+b),1,99)); return e;
}

function teamRatings(t){
  if(t.starters.some(x=>!x))return null;
  const es=t.starters.map((c,i)=>eff(c.pd,c,i,t.adj||0));
  const eb=t.bench.map(c=>eff(c.pd,c,null,t.adj||0)).sort((x,y)=>y.ovr-x.ovr).slice(0,5);
  const avg=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
  const off=avg(es.map(e=>({v:Math.max(e.thr,e.ins)*.55+e.ply*.2+e.ovr*.25})),"v");
  const st=avg(es,"ovr"); const bn=eb.length?avg(eb,"ovr"):st-12;
  return {ovr:Math.round(st*.82+bn*.18),off:Math.round(off),def:Math.round(avg(es,"def")),reb:Math.round(avg(es,"reb")),ply:Math.round(avg(es,"ply")),thr:Math.round(avg(es,"thr"))};
}
function stageTeam(i){
  const sg=STAGES[i];
  if(sg.fixed){return{name:sg.name,starters:sg.fixed.st.map(id=>({pd:BYID[id],stars:sg.fixed.stars})),bench:sg.fixed.bn.map(id=>({pd:BYID[id],stars:sg.fixed.stars})),adj:sg.adj||0,tac:sg.tac};}
  const r=seeded(i*7919+13), used=new Set();
  const starters=POS.map(pos=>{
    const c=PL.filter(p=>p.pos===pos&&!used.has(p.id)).map(p=>({p,d:Math.abs(p.ovr-sg.t)+r()*6})).sort((a,b)=>a.d-b.d)[0].p;
    used.add(c.id); return{pd:c,stars:1};});
  const bench=Array.from({length:BENCH_MIN},(_,k)=>{const c=PL.filter(p=>!used.has(p.id)).map(p=>({p,d:Math.abs(p.ovr-(sg.t-(k<3?4:8)))+r()*8})).sort((a,b)=>a.d-b.d)[0].p;used.add(c.id);return{pd:c,stars:1};});
  const t={name:sg.name,starters,bench,adj:0,tac:sg.tac};
  t.adj=sg.adj!=null?sg.adj:clamp(sg.t-teamRatings(t).ovr,-9,8);
  return t;
}

/* ================= SIMULATION ================= */
function simulate(A,B,log=true){return makeGame(A,B,log).runTo(Infinity);}
// a game that can be played in parts (first half, then second half with a new plan)
function makeGame(A,B,log=true){
  const sides=[A,B].map(team=>{
    const people=[];
    const mk=(c,starter)=>{const p={id:c.pd.id,name:c.pd.name,pos:c.pd.pos,pd:c.pd,stars:c.stars,plus:c.plus||0,bonus:c.bonus||0,starter,form:randn()*2.5,sec:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,to:0};people.push(p);return p;};
    const st=team.starters.map(c=>mk(c,true)), bn=team.bench.map(c=>mk(c,false));
    const at=(p,slot,x=0)=>eff(p.pd,p,slot,(team.adj||0)+p.form+x);
    // depth chart: each bench player backs up the position he fits best; deeper backups at a position cost 6 "fit" points
    const chain=st.map(p=>[p]);
    bn.slice().sort((x,y)=>at(y,null).ovr-at(x,null).ovr).forEach(b=>{let bi=0,bv=-1e9;
      for(let i=0;i<5;i++){const v=at(b,i).ovr-(chain[i].length-1)*6;if(v>bv){bv=v;bi=i;}}chain[bi].push(b);});
    const cache=new Map(), attr=(p,i,x)=>{const k=p.id+"|"+i+"|"+x;if(!cache.has(k))cache.set(k,at(p,i,x));return cache.get(k);};
    return{team,people,chain,attr,score:0,tac:{...DEF_TAC,...(team.tac||{})},trans:false,fbp:0,oreb:0};
  });
  // who plays each 4-minute segment (12 per game): S = starter, 1/2/3 = 1st/2nd/3rd backup at that position
  const PATS={normal:"SS11SSSS12SS",heavy:"SSS1SSSSSSSS",deep:"SS12S2SS31SS"};
  const ev=[], qs=[];
  let q=0, clock=0;
  const fmt=c=>`${Math.floor(c/60)}:${String(Math.floor(c%60)).padStart(2,"0")}`;
  const push=(side,text,hl)=>{if(log)ev.push({q,clock:fmt(clock),side,text,hl,sa:sides[0].score,sb:sides[1].score});};
  const avg=(L,k)=>L.reduce((s,x)=>s+x.a[k],0)/5;
  const lineup=SD=>{const rot=SD.tac.rot, seg=Math.min(2,Math.floor((720-clock-0.01)/240)), g=q<4?q*3+seg:-1;
    return SD.chain.map((ch,i)=>{
      const k=g<0?"S":PATS[rot][(g+(i>=3?1:0))%12];   // bigs sub one segment earlier than guards
      const d=k==="S"?0:Math.min(+k,ch.length-1);
      const x=d===0&&q>=3?(rot==="heavy"?-4:rot==="deep"?2:0):0;   // Q4: tired or fresh starters
      return{p:ch[d],a:SD.attr(ch[d],i,x)};});};

  function runPoss(o,d){
    const OS=sides[o], DS=sides[d], ot=OS.tac, dt=DS.tac;
    const off=lineup(OS), def=lineup(DS);
    const tr=OS.trans; OS.trans=false;
    const PR={slow:[13,25],normal:[9,23],fast:[6,17]}[ot.pace], hi=dt.def==="press"?Math.min(PR[1],17):PR[1];
    const t=Math.min(clock,tr?4+Math.floor(rand()*5):PR[0]+Math.floor(rand()*(hi-PR[0]+1))); clock-=t;
    off.forEach(x=>x.p.sec+=t); def.forEach(x=>x.p.sec+=t);
    const dDef=avg(def,"def"), oPly=avg(off,"ply"), oReb=avg(off,"reb"), dReb=avg(def,"reb");
    const rp=Math.max(...def.map(x=>x.a.def*.6+x.a.reb*.4));
    let toP=.125+(dDef-oPly)*.0025+(ot.pace==="fast"?.006:ot.pace==="slow"?-.006:0)+(ot.off==="star"?.005:0)-(tr?.03:0);
    if(dt.def==="press")toP+=.025+(dDef-oPly)*.002;
    toP=clamp(toP,.04,.26);
    const uExp=ot.off==="star"?3.4:2.2, mdW=dt.def==="zone"?.5:1;
    // "three"/"inside" also steer the ball to the team's best shooters / inside scorers
    const focus=x=>ot.off==="three"?Math.pow(x.a.thr/75,3):ot.off==="inside"?Math.pow(x.a.ins/75,3):1;
    for(let tries=0;tries<4;tries++){
      // turnover
      if(rand()<toP){
        const h=pickW(off,x=>Math.pow(x.a.ply,2)); h.p.to++;
        if(rand()<.55){const s=pickW(def,x=>Math.pow(x.a.def,3));s.p.stl++;if(rand()<.4)DS.trans=true;push(d,`${short(s.p.name)} ขโมยบอลจาก ${short(h.p.name)}!`,rand()<.4);}
        else push(o,`${short(h.p.name)} เสียการครองบอล`);
        return;
      }
      const sh=pickW(off,x=>Math.pow(Math.max(1,x.a.ovr*.5+Math.max(x.a.thr,x.a.ins)*.5-55),uExp)*focus(x));
      const md=def[off.indexOf(sh)].a, a=sh.a, P=sh.p;
      const p3=clamp(clamp((a.thr-50)/90,.02,.6)*(ot.off==="three"?1.45:ot.off==="inside"?.55:1)*(dt.def==="zone"?1.3:1),.01,.8);
      let type=rand()<p3?"3":(rand()<clamp(.55+(a.ins-a.thr)*.004+(ot.off==="inside"?.15:0),.3,.92)?"rim":"mid");
      const fb=tr&&tries===0&&rand()<.7; if(fb)type="rim";   // fast break
      // shot quality = shot skill + overall skill (OVR) − matchup defense − team/rim defense, then plan effects
      const sk=(a.ovr-75)*.003;
      let pm;
      if(type==="3")pm=.355+(a.thr-75)*.0042+sk-(md.def-75)*.0025*mdW-(dDef-75)*.0015;
      else if(type==="rim")pm=.58+(a.ins-75)*.005+sk-(md.def-75)*.002*mdW-(rp-80)*.003;
      else pm=.42+((a.thr+a.ins)/2-75)*.0035+sk-(md.def-75)*.003*mdW;
      pm+=(ot.pace==="slow"?.004:0)+(ot.pace==="fast"&&type==="rim"?.01:0)+(ot.off==="bal"?.01:0)+(fb?.07:0)-(ot.def==="press"?.01:0);
      if(dt.def==="zone")pm+=type==="3"?.045:type==="rim"?-.05:-.01;
      if(dt.def==="press"&&type==="rim")pm+=.05;
      pm=clamp(pm,.1,.88);
      const fouled=rand()<(type==="rim"?.12:type==="mid"?.05:.02);
      const made=rand()<pm, val=type==="3"?3:2;
      const ftp=clamp(.55+(a.thr-50)*.008,.45,.93);
      const fts=n=>{let m=0;for(let i=0;i<n;i++){P.fta++;if(rand()<ftp){m++;P.ftm++;}}P.pts+=m;OS.score+=m;return m;};
      if(made){
        P.fga++;P.fgm++; if(type==="3"){P.tpa++;P.tpm++;}
        P.pts+=val; OS.score+=val; if(fb)OS.fbp+=val;
        let as="";
        if(rand()<(type==="3"?.8:type==="rim"?.55:.45)){const others=off.filter(x=>x!==sh);const ap=pickW(others,x=>Math.pow(x.a.ply,3));ap.p.ast++;as=` (แอสซิสต์: ${short(ap.p.name)})`;}
        let txt=type==="3"?"ยิงสามแต้ม ลง!":type==="rim"?(a.ins>=86&&rand()<.5?"ดังค์สนั่น!":"เลย์อัพลง"):"จัมพ์ช็อตระยะกลางลง";
        if(fb)txt="บุกเร็ว "+txt;
        if(fouled){const m=fts(1);txt+=` + แอนด์วัน ${m?"ลง":"ไม่ลง"}`;}
        push(o,`${short(P.name)} ${txt}${as}`,type==="3"||txt.includes("ดังค์")||fouled||fb);
        return;
      }
      if(fouled){const n=type==="3"?3:2;const m=fts(n);push(o,`${short(P.name)} โดนฟาวล์ขณะยิง ลูกโทษลง ${m}/${n}`);return;}
      P.fga++; if(type==="3")P.tpa++;
      if(type==="rim"&&rand()<.17*Math.pow(rp/85,2)){const b=def.reduce((m,x)=>x.a.def+x.a.reb>m.a.def+m.a.reb?x:m);b.p.blk++;push(d,`${short(b.p.name)} บล็อก ${short(P.name)}!`,true);}
      else push(o,`${short(P.name)} ${type==="3"?"ยิงสามแต้มไม่ลง":type==="rim"?"บุกใต้แป้นไม่ลง":"จัมพ์ช็อตไม่ลง"}`);
      if(rand()<clamp(.24+(oReb-dReb)*.009+(ot.reb==="crash"?.06:ot.reb==="back"?-.06:0),.06,.5)){
        const r=pickW(off,x=>Math.pow(x.a.reb,3));r.p.reb++;OS.oreb++;push(o,`${short(r.p.name)} รีบาวด์เกมรุก`);continue;}
      const r=pickW(def,x=>Math.pow(x.a.reb,3));r.p.reb++;
      if(rand()<({crash:.32,normal:.12,back:.04})[ot.reb])DS.trans=true;   // leak-out after a defensive rebound
      return;
    }
  }
  const jump=rand()<.5?0:1;
  const G={sides,ev,qs,done:false,a:0,b:0};
  if(log)ev.push({q:0,clock:"12:00",side:-1,text:`จัมพ์บอล! ${sides[jump].team.name} ได้ครองบอลก่อน`,sys:true,sa:0,sb:0});
  // play quarters until quarter index n (2 = halftime) or the end of the game
  G.runTo=n=>{
    while(!G.done&&q<n){
      clock=q<4?720:300; sides.forEach(s=>s.trans=false);
      const a0=sides[0].score,b0=sides[1].score;
      let o=q<4?(q%2===0?jump:1-jump):(rand()<.5?0:1);
      while(clock>0){runPoss(o,1-o);o=1-o;}
      qs.push([sides[0].score-a0,sides[1].score-b0]);
      if(log)ev.push({q,clock:"0:00",side:-1,sys:true,text:q===1?"จบครึ่งแรก · พักครึ่ง":q<3?`จบควอเตอร์ ${q+1}`:q===3?"จบเวลาปกติ":`จบโอเวอร์ไทม์ ${q-3}`,sa:sides[0].score,sb:sides[1].score});
      if(q>=3&&sides[0].score!==sides[1].score)G.done=true;
      q++;
    }
    G.a=sides[0].score;G.b=sides[1].score;return G;
  };
  return G;
}

/* ================= GACHA ================= */
function rollRar(guarantee){
  if(S.pity>=PITY-1)return"L";
  const r=rand();let rar=r<.03?"L":r<.15?"E":r<.45?"R":"C";
  if(guarantee&&(rar==="C"||rar==="R"))rar=rand()<.2?"L":"E";
  return rar;
}
function pullOne(guarantee){
  const rar=rollRar(guarantee); S.pity=rar==="L"?0:S.pity+1; S.pulls++;
  const pool=BYRAR[rar], pd=pool[Math.floor(rand()*pool.length)];
  const kind=addCard(pd);
  return{pd,kind,stars:S.owned[pd.id].stars,rar};
}
// new card, or a duplicate kept as a spare copy (for star-ups or enhancement); coins back once the spare pile is full
const MAX_SPARES=20;
function addCard(pd){
  const o=S.owned[pd.id];
  if(!o){S.owned[pd.id]={stars:1,n:1,plus:0,spent:0,spares:[]};return"new";}
  o.n++;
  if(o.spares.length<MAX_SPARES){o.spares.push({plus:0,spent:0});return"dup";}
  S.coins+=RAR[pd.rar].refund;return"cash";
}
let lastPull=null;
function doPull(n){
  const cost=n===1?COST1:COST10;
  if(S.coins<cost){toast("เหรียญไม่พอ ลองแข่งในลีกเพื่อหาเหรียญเพิ่ม");return;}
  S.coins-=cost;
  // decide rarities first so the 10-pull guarantee applies to the last card
  const res=[];
  for(let i=0;i<n;i++){
    const need=n===10&&i===9&&!res.some(r=>r.rar==="E"||r.rar==="L");
    res.push(pullOne(need));
  }
  lastPull=res.map(r=>({...r,open:false}));
  save(); render();
}

// first launch: free draws until the player owns STARTER_N different players (no duplicates, at least 2 per position)
const STARTER_N=20, STARTER_PER_POS=2;
function starterPull(){
  const have=Object.keys(S.owned).length; if(have>=STARTER_N)return;
  const n=Math.min(10,STARTER_N-have), res=[];
  for(let k=0;k<n;k++){
    const left=STARTER_N-Object.keys(S.owned).length;
    const need=POS.filter(p=>PL.filter(x=>x.poss.includes(p)&&S.owned[x.id]).length<STARTER_PER_POS);
    const needSlots=need.reduce((s,p)=>s+STARTER_PER_POS-PL.filter(x=>x.poss.includes(p)&&S.owned[x.id]).length,0);
    const mustFill=needSlots>=left;
    let rar=rollRar(k===n-1&&!res.some(r=>r.rar==="E"||r.rar==="L"));
    let pool=PL.filter(x=>x.rar===rar&&!S.owned[x.id]&&(!mustFill||x.poss.some(q=>need.includes(q))));
    if(!pool.length)pool=PL.filter(x=>!S.owned[x.id]&&(!mustFill||x.poss.some(q=>need.includes(q))));
    const pd=pool[Math.floor(rand()*pool.length)];
    addCard(pd); res.push({pd,kind:"new",stars:1,rar:pd.rar,open:false});
  }
  lastPull=res; save(); render();
}
function finishStarter(){S.starterDone=true;lastPull=null;autoLineup();save();setView("team");toast("จัดทีมให้อัตโนมัติแล้ว ปรับได้ตามใจ");}

      :(lastPull&&lastPull.some(r=>!r.open)?"":`<button class="btn gold" id="starterPull">สุ่ม ${Math.min(10,STARTER_N-have)} ใบ · ฟรี</button>`)}</div>

  if(lastPull)h+=revealHTML(done?`<button class="btn primary" id="starterDone">เริ่มเล่น · จัดทีมให้อัตโนมัติ →</button>`:`<button class="btn gold" id="starterPull">สุ่มอีก ${Math.min(10,STARTER_N-have)} ใบ · ฟรี</button>`);

function autoLineup(f){
  f=AUTO_F[f]?f:(S.autoF||"ovr"); S.autoF=f;
  const ids=Object.keys(S.owned); const L=Array(LINEUP_N).fill(null); const used=new Set();
  for(let n=0;n<5;n++){let best=null;
    ids.forEach(id=>{if(used.has(id))return;for(let s=0;s<5;s++){if(L[s])continue;const e=eff(BYID[id],S.owned[id],s), v=autoScore(e,f)-(e.pen||0)*3;if(!best||v>best.v)best={id,s,v};}});
    if(!best)break;L[best.s]=best.id;used.add(best.id);}
  const sc=id=>autoScore(eff(BYID[id],S.owned[id]),f);
  ids.filter(id=>!used.has(id)).sort((a,b)=>sc(b)-sc(a)).slice(0,BENCH_MAX).forEach((id,i)=>L[5+i]=id);
  S.lineup=L;save();render();toast(f==="ovr"?"จัดทีมที่ดีที่สุดให้แล้ว":`จัดทีมแบบ${AUTO_F[f]}ให้แล้ว`);

/* ---------- match playback ---------- */
let timer=null;
function stopPlay(){if(timer){clearInterval(timer);timer=null;}}
function startMatch(i){
  const me=myTeam(), op=stageTeam(i);
  const g=makeGame(me,op,true); g.runTo(2);   // first half; the plan can change at halftime
  match={g,i,shown:0,speed:120,half:false,done:false,tac:{...S.tac},opTac:op.tac,opName:STAGES[i].name,opOvr:STAGES[i].t,myOvr:teamRatings(me).ovr};
  view="match";render();play();
}
function play(){stopPlay();if(!match||match.done||match.half)return;timer=setInterval(step,match.speed);}
function step(){
  if(!match)return stopPlay();
  match.shown++;
  if(match.shown>=match.g.ev.length){match.shown=match.g.ev.length;stopPlay();
    if(!match.g.done){match.half=true;render();return;}
    finishMatch();return;}
  updateBoard();
}
function skipAhead(){
  stopPlay(); match.shown=match.g.ev.length;
  if(!match.g.done){match.half=true;render();}else finishMatch();
}
function secondHalf(skip){
  const g=match.g; g.sides[0].tac={...match.tac}; g.runTo(Infinity); match.half=false;
  if(skip){match.shown=g.ev.length;finishMatch();return;}
  render();play();
}
function finishMatch(){
  const g=match.g, i=match.i, won=g.a>g.b;
  const reward=won?20+(i+1)*15:10; let firstBonus=0;
  if(won&&i===S.cleared&&S.cleared<STAGES.length){firstBonus=400+(i+1)*100;S.cleared++;}
  S.coins+=reward+firstBonus; won?S.w++:S.l++; save();
  Object.assign(match,{won,reward,firstBonus,done:true}); render();
}
function updateBoard(){
  const e=match.g.ev[match.shown-1]||{q:0,clock:"12:00",sa:0,sb:0};
  const qn=e.q<4?`Q${e.q+1}`:`OT${e.q-3}`;
  const sa=$("#sa"),sb=$("#sb");if(!sa)return;
  sa.textContent=e.sa;sb.textContent=e.sb;$("#qq").textContent=qn;$("#cc").textContent=e.clock;
  $("#feed").innerHTML=feedHTML();
}
function feedHTML(){
  const evs=match.g.ev.slice(0,match.shown).slice(-60).reverse();
  return evs.map(e=>`<div class="ev ${e.sys?"sys":"s"+e.side}${e.hl?" hl":""}"><span class="tt">${e.q<4?"Q"+(e.q+1):"OT"} ${e.clock}</span><span>${esc(e.text)}</span><span class="ss">${e.sa}-${e.sb}</span></div>`).join("");
}
function boxHTML(side,title){
  const rows=side.people.slice().sort((a,b)=>(b.starter-a.starter)||b.sec-a.sec);
  return `<h3>${esc(title)}</h3><table><thead><tr><th>ผู้เล่น</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG</th><th>3P</th><th>FT</th><th>TO</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td class="pl">${esc(p.name)}<small>${p.pd.posTxt}${p.starter?"":" · สำรอง"}</small></td><td>${Math.round(p.sec/60)}</td><td><b>${p.pts}</b></td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td><td>${p.fgm}-${p.fga}</td><td>${p.tpm}-${p.tpa}</td><td>${p.ftm}-${p.fta}</td><td>${p.to}</td></tr>`).join("")}</tbody></table>`;
}
function teamStatsHTML(g,title){
  const s=g.sides.map(sd=>{const t={pts:sd.score,fgm:0,fga:0,tpm:0,tpa:0,reb:0,ast:0,to:0,stl:0};sd.people.forEach(p=>{for(const k in t)if(k!=="pts")t[k]+=p[k];});t.fbp=sd.fbp;t.oreb=sd.oreb;return t;});
  const pct=(m,a)=>a?Math.round(m/a*100)+"%":"–";
  const rows=[["แต้ม",x=>x.pts],["ยิง FG",x=>`${x.fgm}/${x.fga} (${pct(x.fgm,x.fga)})`],["สามแต้ม",x=>`${x.tpm}/${x.tpa} (${pct(x.tpm,x.tpa)})`],["รีบาวด์ (เกมรุก)",x=>`${x.reb} (${x.oreb})`],["แอสซิสต์",x=>x.ast],["เสียการครองบอล",x=>x.to],["ขโมยบอล",x=>x.stl],["แต้มจากบุกเร็ว",x=>x.fbp]];
  return `<div class="box"><h3>${title}</h3><table><thead><tr><th></th><th>ทีมของคุณ</th><th>${esc(match.opName)}</th></tr></thead><tbody>${rows.map(([l,f])=>`<tr><td>${l}</td><td>${f(s[0])}</td><td>${f(s[1])}</td></tr>`).join("")}</tbody></table></div>`;
}

function sortedOwned(){ // team members first (by slot), then rarity, then OVR
  const RO={L:0,E:1,R:2,C:3};
  return Object.keys(S.owned).sort((a,b)=>{const ia=S.lineup.indexOf(a),ib=S.lineup.indexOf(b);
    const la=ia<0?99:ia, lb=ib<0?99:ib; if(la!==lb)return la-lb;
    return RO[BYID[a].rar]-RO[BYID[b].rar]||eff(BYID[b],S.owned[b]).ovr-eff(BYID[a],S.owned[a]).ovr;});
}
function rowHTML(id,attrs,right,active,tag="button"){

   <span class="povr">${e.ovr}<span>OVR</span></span>${right}</${tag}>`;

/* ================= ENHANCE (ตีบวก) ================= */
// owned[id] = {stars, plus, spent, n, spares:[{plus,spent}]} — the main copy carries the stars; spares are duplicate copies.
// Every hit needs a 2nd copy of the same player as material; it is used up win or lose. Each + on the material adds MAT_BONUS.
// Failing toward +4..+6 drops a level; failing toward +7..+9 destroys the target copy.
const ENH_RATE=[1,1,1,.8,.7,.6,.5,.4,.3], ENH_MAX=9, ENH_DROP=4, ENH_BREAK=7, ENH_MULT={C:1,R:1.6,E:2.5,L:4}, MAT_BONUS=.05;
const enhCost=(lv,rar)=>Math.round(40*(lv+1)*ENH_MULT[rar]/10)*10;
const enhFate=lv=>lv+1>=ENH_BREAK?"break":lv+1>=ENH_DROP?"drop":"safe";
const enhRate=(lv,mp)=>Math.min(1,ENH_RATE[lv]+mp*MAT_BONUS);
let enhSel=null, enhMsg=null, enhConfirm=false, enhTgt=-1, enhMat=null;
function defaultMat(sp,tgt){let best=-1;sp.forEach((s,i)=>{if(i!==tgt&&(best<0||s.plus<sp[best].plus))best=i;});return best;}
// a copy can be hit when it is below the cap and another spare of the same player is left to use as material
const canHitMain=o=>o.spares.length>=1&&(o.plus||0)<ENH_MAX;
const canHitSpare=(o,i)=>o.spares.length>=2&&o.spares[i].plus<ENH_MAX;
const canEnh=id=>{const o=S.owned[id];return canHitMain(o)||o.spares.some((_,i)=>canHitSpare(o,i));};
function vEnh(){
  const ids=sortedOwned().filter(canEnh);
  if(!ids.length)return `<h2>ตีบวกการ์ด</h2><div class="panel" style="max-width:640px">
    <div class="eyebrow">ยังไม่มีการ์ดที่ตีบวกได้</div>
    <p style="margin:8px 0 14px">ตีบวกต้องใช้การ์ด 2 ใบของผู้เล่นคนเดียวกัน: ใบที่จะตี + ใบซ้ำเป็นวัตถุดิบ และใบที่จะตีต้องยังไม่ถึง +${ENH_MAX} · หาการ์ดซ้ำได้จากการเปิดแพ็กหรือซื้อผู้เล่นที่มีอยู่แล้วในตลาด</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-goto="gacha">ไปเปิดการ์ด</button><button class="btn" data-goto="market">ไปตลาด</button></div></div>`;
  if(!enhSel||!S.owned[enhSel])enhSel=ids[0];
  const pd=BYID[enhSel], o=S.owned[enhSel], sp=o.spares;
  if(enhTgt>=sp.length||(enhTgt<0?!canHitMain(o):!canHitSpare(o,enhTgt)))enhTgt=canHitMain(o)?-1:sp.findIndex((_,i)=>canHitSpare(o,i));
  if(enhMat==null||enhMat<0||enhMat>=sp.length||enhMat===enhTgt)enhMat=defaultMat(sp,enhTgt);
  const T=enhTgt<0?o:sp[enhTgt], lv=T.plus||0, tStars=enhTgt<0?o.stars:1;
  const cur=eff(pd,{stars:tStars,plus:lv}), nxt=eff(pd,{stars:tStars,plus:lv+1});
  const hasMat=enhMat>=0, mp=hasMat?sp[enhMat].plus:0;
  const max=lv>=ENH_MAX, base=max?0:ENH_RATE[lv], rate=max?0:enhRate(lv,mp), cost=max?0:enhCost(lv,pd.rar), fate=enhFate(lv);
  const failTxt={safe:"เสียแค่เหรียญ",drop:`ลดเป็น +${lv-1}`,break:"การ์ดหาย!"}[fate];
  const tName=enhTgt<0?"ใบหลัก":`ใบซ้ำ #${enhTgt+1}`;
  const chip=(attr,k,label,plus,on,extra="")=>`<button class="fbtn" ${attr}="${k}" aria-pressed="${on}">${label} +${plus}${extra}</button>`;
  const btn=max||!hasMat?"":fate==="break"&&enhConfirm
    ?`<div class="enhwarn">ถ้าล้มเหลว <b>${esc(pd.name)} (${tName} +${lv})</b> จะหายไปถาวร และการ์ดวัตถุดิบก็หายด้วย (โอกาสล้มเหลว ${Math.round((1-rate)*100)}%)
       <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn danger" id="enhBtn">ยืนยัน ตีบวก</button><button class="btn" id="enhNo">ยกเลิก</button></div></div>`
    :`<button class="btn primary" id="enhBtn" ${S.coins<cost?"disabled":""}>ตีบวก <span class="price"><span class="coin"></span>${cost.toLocaleString()}</span>${fate==="break"?" · เสี่ยงการ์ดหาย":""}</button>`;
  return `<h2>ตีบวกการ์ด</h2><p class="sub">ตีบวกต้องใช้การ์ด 2 ใบ: ใบที่จะตี + การ์ดซ้ำของผู้เล่นคนเดียวกันเป็นวัตถุดิบ (ใช้หมดทุกครั้งที่ตี) · วัตถุดิบ +1 เพิ่มโอกาส ${MAT_BONUS*100}% · ตีขึ้น +1 ถึง +3 ล้มเหลวเสียแค่เหรียญ · +4 ถึง +6 ลดระดับ 1 · +7 ถึง +9 การ์ดหาย</p>
  <div class="enhgrid">
   <div class="panel enhmain">
     <div class="enhcard ${enhMsg?enhMsg.cls:""}">${cardHTML(pd,{stars:tStars,plus:lv},{cw:"clamp(150px,40vw,190px)"})}</div>
     <div class="enhinfo">
       <div><div class="note">ใบที่จะตี</div><div class="filters" style="margin:4px 0 0">${canHitMain(o)?chip("data-tgt",-1,"ใบหลัก"+(o.stars>1?" ★"+o.stars:""),o.plus||0,enhTgt<0):""}${sp.map((s,i)=>canHitSpare(o,i)?chip("data-tgt",i,`ใบซ้ำ #${i+1}`,s.plus,enhTgt===i):"").join("")}</div></div>
       <div><div class="note">การ์ดใบที่ 2 (วัตถุดิบ · จะหายไปหลังตี)</div>
         ${sp.some((s,i)=>i!==enhTgt)?`<div class="filters" style="margin:4px 0 0">${sp.map((s,i)=>i===enhTgt?"":chip("data-mat",i,`ใบซ้ำ #${i+1}`,s.plus,enhMat===i,s.plus?` · +${Math.round(s.plus*MAT_BONUS*100)}%`:"")).join("")}</div>`
           :`<p class="enhwarn" style="margin:4px 0 0;border-color:var(--line);background:var(--panel2)">ต้องมีการ์ด ${esc(pd.name)} ซ้ำอีกใบเพื่อใช้เป็นวัตถุดิบ หาได้จากการเปิดแพ็กหรือซื้อในตลาด</p>`}</div>
       <div class="enhlv"><span>+${lv}</span>${max?"":`<b>→</b><span class="to">+${lv+1}</span>`}</div>
       ${max?`<p style="margin:0">การ์ดใบนี้ตีบวกเต็มแล้ว</p>`:`
       <div class="enhstats">${["ovr",...ATTR].map(k=>`<div><span>${k==="ovr"?"OVR":ATTR_LBL[k]}</span>${cur[k]}<b class="up">→ ${nxt[k]}</b></div>`).join("")}</div>
       <div class="enhmeta"><div><span>โอกาสสำเร็จ</span><b class="${rate<.5?"dn":rate<1?"":"up"}">${Math.round(rate*100)}%</b>${hasMat&&rate>base?`<small class="up"> (ฐาน ${Math.round(base*100)}% + วัตถุดิบ)</small>`:""}</div>
         <div><span>ถ้าล้มเหลว</span><b class="${fate==="safe"?"":"dn"}">${failTxt}</b></div></div>
       ${btn}`}
       ${enhMsg?`<p class="enhmsg ${enhMsg.cls}">${esc(enhMsg.text)}</p>`:""}
     </div>
   </div>
   <div><div class="eyebrow" style="margin-bottom:8px">ผู้เล่นที่ตีบวกได้ ${ids.length} คน · ตัวในทีมขึ้นก่อน</div>
     <div class="plist">${ids.map(id=>rowHTML(id,`data-enh="${id}"`,`<span class="pplus">+${S.owned[id].plus||0}</span>`,id===enhSel)).join("")}</div></div>
  </div>`;
}
function doEnh(){
  const o=S.owned[enhSel], pd=BYID[enhSel], sp=o.spares;
  const mat=enhMat, tgt=enhTgt;
  if(mat==null||mat<0||mat===tgt||!sp[mat])return;
  const T0=tgt<0?o:sp[tgt], lv=T0.plus||0; if(lv>=ENH_MAX)return;
  const cost=enhCost(lv,pd.rar); if(S.coins<cost){toast("เหรียญไม่พอ");return;}
  const fate=enhFate(lv);
  if(fate==="break"&&!enhConfirm){enhConfirm=true;render();return;}
  enhConfirm=false;
  const rate=enhRate(lv,sp[mat].plus), mPlus=sp[mat].plus;
  S.coins-=cost;
  sp.splice(mat,1);                       // material copy is always used up
  let t=tgt; if(t>mat)t--;
  const T=t<0?o:sp[t]; T.spent=(T.spent||0)+cost;
  const nm=`${pd.name} (${t<0?"ใบหลัก":"ใบซ้ำ"})`, used=` · ใช้ใบซ้ำ +${mPlus} ไป`;
  if(rand()<rate){T.plus=lv+1;enhMsg={cls:"ok",text:`สำเร็จ! ${nm} เป็น +${lv+1}${used}`};}
  else if(fate==="break"){
    if(t>=0){sp.splice(t,1);t=-1;enhMsg={cls:"broke",text:`ล้มเหลว! ใบซ้ำ +${lv} แตกหายไปแล้ว${used}`};}
    else if(sp.length){ // main breaks: the best spare becomes the new main at ★1
      let b=0;sp.forEach((s,i)=>{if(s.plus>sp[b].plus)b=i;});const nb=sp.splice(b,1)[0];
      o.plus=nb.plus;o.spent=nb.spent;o.stars=1;
      enhMsg={cls:"broke",text:`ล้มเหลว! ใบหลัก +${lv} แตกหาย · ใบซ้ำ +${nb.plus} ขึ้นเป็นใบหลักแทน (★1)${used}`};
    }else{
      delete S.owned[enhSel]; S.lineup=S.lineup.map(x=>x===enhSel?null:x); enhSel=null;
      enhMsg={cls:"broke",text:`ล้มเหลว! ${pd.name} +${lv} แตกหายไปแล้ว${used}`};
      toast(`${pd.name} แตกหายไปแล้ว${S.lineup.slice(0,5).some(x=>!x)?" · อย่าลืมจัดตัวจริงใหม่":""}`);
    }
  }
  else if(fate==="drop"){T.plus=lv-1;enhMsg={cls:"fail",text:`ล้มเหลว! ระดับลดลงเป็น +${lv-1}${used}`};}
  else enhMsg={cls:"fail",text:`ล้มเหลว! ยังอยู่ที่ +${lv}${used}`};
  enhTgt=t; enhMat=null;
  save();render();
}
// uses the spare with the lowest + to raise the main card one star
const canStar=o=>o&&o.stars<5&&o.spares.length>0;
function starUp(id){
  const o=S.owned[id], sp=o.spares, i=defaultMat(sp,-1);
  if(!canStar(o))return;
  sp.splice(i,1); o.stars++; enhMat=null; if(enhSel===id)enhTgt=-1;
  save(); render(); toast(`${BYID[id].name} อัปเป็น ★${o.stars} (ใช้ใบซ้ำ 1 ใบ)`);
}

/* ================= MARKET ================= */
// prices move every hour; listings are the same for everyone within an hour unless re-rolled
const MBASE={C:60,R:160,E:450,L:1600}, MMIN={C:74,R:82,E:88,L:93}, SELL_PCT=.4, REROLL=50;
const hourKey=()=>Math.floor(Date.now()/3600000);
const hsh=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;};
function mPrice(pd,k=hourKey()){const v=MBASE[pd.rar]*(1+(pd.ovr-MMIN[pd.rar])/12);const f=.8+seeded(hsh(pd.id+":"+k))()*.45;return Math.round(v*f/5)*5;}
// a player with spares sells one spare (the lowest +) first; otherwise the main copy
const r5=v=>Math.round(v/5)*5;
function sellPrice(id){const o=S.owned[id],sp=o.spares,i=defaultMat(sp,-1);
  if(i>=0)return r5(mPrice(BYID[id])*SELL_PCT)+r5((sp[i].spent||0)*.4);
  return r5(mPrice(BYID[id])*(1+.7*(o.stars-1))*SELL_PCT)+r5((o.spent||0)*.4);}
function listings(){
  const key=hourKey()+"-"+(S.refresh||0);
  if(!S.market||S.market.key!==key)S.market={key,bought:[]};
  const r=seeded(hsh("m"+key)), used=new Set();
  const rars=["C","C","R","R","R","E","E",r()<.4?"L":"E"];
  return rars.map(rar=>{const pool=BYRAR[rar].filter(p=>!used.has(p.id));const p=pool[Math.floor(r()*pool.length)];used.add(p.id);return p;});
}
let sellConfirm=null;
function vMarket(){
  const L=listings(), k=hourKey(), mins=60-new Date().getMinutes(), ids=sortedOwned();
  return `<h2>ตลาดซื้อขายผู้เล่น</h2><p class="sub">ราคาขึ้นลงทุกชั่วโมง · ประกาศขายชุดใหม่ในอีก ${mins} นาที · อยากได้ใครเจาะจง ซื้อที่นี่แทนการสุ่ม</p>
  <div class="mhead"><div class="eyebrow">ประกาศขายตอนนี้</div><button class="btn sm" id="mRefresh" ${S.coins<REROLL?"disabled":""}>สุ่มประกาศใหม่ <span class="price"><span class="coin"></span>${REROLL}</span></button></div>
  <div class="mgrid">${L.map(pd=>{const o=S.owned[pd.id], pr=mPrice(pd), prev=mPrice(pd,k-1), sold=S.market.bought.includes(pd.id), full=o&&o.spares.length>=MAX_SPARES;
     const tr=pr>prev?`<span class="up">▲${Math.round((pr/prev-1)*100)}%</span>`:pr<prev?`<span class="dn">▼${Math.round((1-pr/prev)*100)}%</span>`:"";
     return `<div class="mitem">${cardHTML(pd,o||1,{locked:sold})}
       <div class="mnote">${sold?"ซื้อแล้ว":o?(full?"การ์ดซ้ำเต็มแล้ว":`มีแล้ว · ใบซ้ำ ${o.spares.length} ใบ`):"ยังไม่มี"} · ${tr||"ราคาคงที่"}</div>
       <button class="btn sm ${sold?"":"primary"}" data-buy="${pd.id}" ${sold||full||S.coins<pr?"disabled":""}>${sold?"ขายไปแล้ว":`ซื้อ <span class="price"><span class="coin"></span>${pr.toLocaleString()}</span>`}</button></div>`;}).join("")}</div>
  <div class="eyebrow" style="margin:28px 0 4px">ขายการ์ดของคุณ</div>
  <p class="note" style="margin:0 0 10px">ได้ ${SELL_PCT*100}% ของราคาตลาด (ใบหลักหลายดาวได้มากขึ้น) + คืน 40% ของเหรียญที่ใช้ตีบวก · ถ้ามีใบซ้ำจะขายใบซ้ำ (+ ต่ำสุด) ก่อน · ขายใบหลักแล้วผู้เล่นจะออกจากทีม</p>
  ${ids.length?`<div class="plist">${ids.map(id=>{const sp=sellPrice(id), what=S.owned[id].spares.length?"ใบซ้ำ":"ใบหลัก";
    const btn=sellConfirm===id?`<span class="sellbtns"><button class="btn sm danger" data-sellyes="${id}">ยืนยันขาย${what} ${sp.toLocaleString()}</button><button class="btn sm" data-sellno="1">ยกเลิก</button></span>`
      :`<button class="btn sm" data-sell="${id}">ขาย${what} <span class="price"><span class="coin"></span>${sp.toLocaleString()}</span></button>`;
    return rowHTML(id,"",btn,false,"div");}).join("")}</div>`:`<p class="sub">ยังไม่มีการ์ดให้ขาย</p>`}`;
}
function buy(id){
  listings(); const pd=BYID[id], pr=mPrice(pd);
  if(S.market.bought.includes(id)||S.coins<pr)return;
  S.coins-=pr; S.market.bought.push(id); const kind=addCard(pd); save(); render();
  toast(kind==="new"?`ได้ ${pd.name} แล้ว`:kind==="dup"?`ได้ ${pd.name} ใบซ้ำ (มี ${S.owned[id].spares.length} ใบ)`:"ได้เหรียญคืน");
}
function sell(id){
  const p=sellPrice(id), nm=BYID[id].name, o=S.owned[id], i=defaultMat(o.spares,-1);
  S.coins+=p;
  if(i>=0)o.spares.splice(i,1);
  else{delete S.owned[id]; S.lineup=S.lineup.map(x=>x===id?null:x); if(enhSel===id)enhSel=null;}
  sellConfirm=null; enhMat=null; enhTgt=-1; save(); render();
  toast(`ขาย ${nm}${i>=0?" (ใบซ้ำ)":""} ได้ ${p.toLocaleString()} เหรียญ`);
}

/* ================= EVENTS ================= */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-slot],[data-flip],[data-pick],.modal");
  if(!t)return;
  if(t.id==="modal"&&ev.target===t){closeModal();return;}
  const d=t.dataset;
  if(d.v){setView(d.v);return;}
  if(d.goto){setView(d.goto);return;}
  if(d.pull){doPull(+d.pull);return;}
  if(d.flip!=null&&lastPull){const r=lastPull[+d.flip];if(!r.open){r.open=true;t.classList.add("open");if(lastPull.every(x=>x.open))render();}return;}
  if(t.id==="openAll"){openAllCards();return;}
  if(t.id==="starterPull"){starterPull();return;}
  if(t.id==="starterDone"){finishStarter();return;}
  if(t.id==="bonusBtn"){S.coins+=300;S.bonusAt=Date.now()+2*3600*1000;save();render();toast("+300 เหรียญ · กลับมารับใหม่ในอีก 2 ชั่วโมง");return;}
  if(t.id==="autoBtn"){autoLineup();return;}
  if(d.autof){S.autoF=d.autof;save();render();return;}
  if(d.pick){assign(d.pick,+d.to);return;}
  if(d.psort){pickSort=d.psort;openPicker(pickerSlot);return;}
  if(d.enh){enhSel=d.enh;enhMsg=null;enhConfirm=false;enhTgt=-1;enhMat=null;render();return;}
  if(d.tgt!=null){enhTgt=+d.tgt;enhMat=null;enhConfirm=false;enhMsg=null;render();return;}
  if(d.mat!=null){enhMat=+d.mat;enhConfirm=false;render();return;}
  if(d.star){starUp(d.star);return;}
  if(t.id==="enhBtn"){doEnh();return;}
  if(t.id==="enhNo"){enhConfirm=false;render();return;}
  if(d.buy){buy(d.buy);return;}
  if(t.id==="mRefresh"){if(S.coins>=REROLL){S.coins-=REROLL;S.refresh=(S.refresh||0)+1;save();render();}return;}
  if(d.sell){sellConfirm=d.sell;render();return;}
  if(d.sellno){sellConfirm=null;render();return;}
  if(d.sellyes){sell(d.sellyes);return;}
  if(d.slot!=null&&view==="team"){openPicker(+d.slot);return;}
  if(d.clear!=null){S.lineup[+d.clear]=null;save();closeModal();render();return;}
  if(t.id==="closeModal"){closeModal();return;}
  if(d.f){collFilter[d.f]=d.fv;render();return;}
  if(d.roster!=null){const i=+d.roster;leagueInfo[i]=Object.assign(leagueInfo[i]||{},{show:!(leagueInfo[i]||{}).show});render();return;}
  if(d.odds!=null){runOdds(+d.odds);return;}
  if(d.play!=null){const iss=rosterIssue();if(iss){toast("ยังลงแข่งไม่ได้: "+iss);return;}startMatch(+d.play);window.scrollTo(0,0);return;}
  if(d.speed){match.speed=+d.speed;play();return;}
  if(t.id==="skip"){skipAhead();return;}
  if(t.id==="half2"){secondHalf(false);return;}
  if(t.id==="half2skip"){secondHalf(true);return;}
  if(d.tac){S.tac={...S.tac,[d.tac]:d.tv};Object.values(leagueInfo).forEach(x=>delete x.odds);save();render();return;}
  if(d.mtac){match.tac[d.mtac]=d.tv;render();return;}
  if(t.id==="backLeague"){match=null;setView("league");return;}
  if(t.id==="resetBtn"){$("#resetbox").innerHTML=`ลบความคืบหน้าทั้งหมด? <button class="btn sm" id="resetYes" style="border-color:var(--lose)">ยืนยันเริ่มใหม่</button> <button class="btn sm" id="resetNo">ยกเลิก</button>`;return;}
  if(t.id==="resetYes"){S=fresh();save();lastPull=null;match=null;leagueInfo={};resetFooter();setView("gacha");toast("เริ่มเกมใหม่แล้ว");return;}
  if(t.id==="resetNo"){resetFooter();return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-flip],.empty")){e.preventDefault();e.target.click();}
});
function resetFooter(){$("#resetbox").innerHTML=`<button class="btn sm" id="resetBtn">เริ่มเกมใหม่</button>`;}
function openAllCards(){
  if(!lastPull)return; let k=0;
  lastPull.forEach((r,i)=>{if(r.open)return;r.open=true;const el=document.querySelector(`[data-flip="${i}"]`);setTimeout(()=>el&&el.classList.add("open"),k++*140);});
  setTimeout(render,k*140+600);
}

render();
cloudInit();
</script>
